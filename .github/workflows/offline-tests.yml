name: offline-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (secret scan)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  pytest:
    runs-on: ubuntu-24.04
    env:
      # No AWS credentials: every AWS call is served by moto. No live market data, no LLM, nothing sent.
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      EMF_STDOUT: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Offline test suite (moto + fixtures + mocked LLM)
        run: pytest -q
      - name: Replay 14 Oct (no live data, no sending)
        run: python -m ict_pipeline.replay
